      <filter id="faceRelief" x="-20%" y="-20%" width="140%" height="140%" primitiveUnits="objectBoundingBox">
        <!-- full primitive chain inserted by script.js:
             1. feDisplacementMap bends the content using a slope map
                (assets/face-gradient-normal-aligned.jpg, Sobel
                gradient of the height map) — geometric bend only.
             2. feDiffuseLighting + feSpecularLighting, fed the real
                height map (assets/face-height-aligned.jpg) via
                luminanceToAlpha, computes actual light/shadow from
                the surface — the content itself stays flat; every
                highlight and shadow the viewer sees is the mask's
                lighting, not a gradient painted on the content.
             both maps are cropped to the same pixel box the clip
             path above was normalized against, so a bump, a
             highlight and the silhouette's width all line up. -->
      </filter>
    </defs>
  </svg>

  <!-- scroll distance driver -->
  <div class="scroll-spacer" aria-hidden="true"></div>

  <header class="nav">
    <div class="nav-logo">ACME</div>
    <nav class="nav-links">
      <a href="#">Work</a>
      <a href="#">Studio</a>
      <a href="#">Contact</a>
      <a href="#">About</a>
      <a href="#" class="nav-lang">EN</a>
    </nav>
  </header>

  <div class="stage">
    <div class="capsule-shell" id="shell"></div>
    <div class="capsule-hole" id="hole">
      <div class="wordmark" id="wordmark">ACME</div>
    </div>
  </div>

  <!-- the mask: a fixed face-shaped window, dead centre, that never
       moves. the ribbon (coloured image/text) scrolls vertically
       INSIDE it — only the slice that lands inside the mask's shape
       is visible, and the mask's own bump filter warps whatever is
       currently passing through it. kept OUTSIDE .stage, as its own
       fixed layer with its own z-index — nested inside .stage's
       stacking context, no z-index on a child could ever put it in
       front of the footer, since the whole .stage context stacks
       below it. -->
  <div class="mask-frame" id="maskFrame">
    <div class="ribbon" id="ribbon">
      <!-- flat fill, no gradients — every bit of light/shadow and bend
           the viewer sees comes from the mask's own filter below, not
           from the content. this is deliberate: content = reference
           colour only, mask = where all the relief/lighting lives. -->
      <div class="ribbon-zone zone-purple" id="zonePurple">
        <div class="zone-content" id="contentPurple">
          <span class="panel-word big">very</span>
        </div>
      </div>
      <div class="ribbon-zone zone-wine" id="zoneWine">
        <div class="zone-content row" id="contentWine">
          <span class="panel-mark">*</span>
          <span class="panel-word">essential</span>
          <span class="panel-mark">*</span>
        </div>
      </div>
      <div class="ribbon-zone zone-lime" id="zoneLime">
        <div class="zone-content" id="contentLime">
          <span class="panel-word big">good</span>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-line"></div>
    <div class="footer-row">

      <span class="footer-contact">hello@example.com</span>
      <span class="footer-insta">Instagram</span>

    </div>
  </footer>
